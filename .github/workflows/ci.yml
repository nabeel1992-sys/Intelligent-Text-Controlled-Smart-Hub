name: PlatformIO CI/CD Pipeline

# This workflow runs whenever you push code or create a pull request
on: [push, pull_request]

jobs:
  # ======== JOB 1: STATIC CODE ANALYSIS ========
  # This job runs on GitHub's cloud servers (ubuntu-latest)
  # It scans the code for complexity and security vulnerabilities before compiling
  code_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install & Run Static Analysis Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flawfinder
          pip install lizard
          echo "Running Security Check with Flawfinder..."
          flawfinder src/ include/
          echo "Running Complexity Check with Lizard..."
          lizard src/ include/

  # ======== JOB 2: BUILD & OTA DEPLOY ========
  # This job runs on your local PC (self-hosted runner)
  # It waits for Job 1 to pass, compiles the firmware, and flashes it via OTA
  build-and-deploy:
    needs: code_analysis  # Wait for code_analysis to pass successfully before starting
    runs-on: self-hosted  # Runs on your local machine to access the local Wi-Fi network
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Build Firmware for ESP32-S3
        run: pio run -e esp32s3_devkit

      - name: Deploy Firmware via OTA (CD)
        # Only run the OTA deployment if the code was pushed to the main branch
        if: github.ref == 'refs/heads/main'
        env:
          # Use GitHub Secrets to securely pass the ESP32's local IP address
          DEVICE_IP: ${{ secrets.DEVICE_IP }}
        run: |
          echo "Uploading firmware to ESP32 at $DEVICE_IP..."
          curl.exe -F "update=@.pio/build/esp32s3_devkit/firmware.bin" http://$env:DEVICE_IP/update